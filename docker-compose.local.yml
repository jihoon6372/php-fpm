version: "3.8"

services:
  php:
    image: jihoon6372/php:8.4-fpm
    build: 
      context: ./php
      dockerfile: Dockerfile
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - web-data:/var/www/html

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - web-data:/var/www/html
    depends_on:
      - php

volumes:
  web-data: